{% extends "public_base.html" %}

{% block content %}
<section class="auth-panel">
    <h2>Kiểm tra email của bạn</h2>
    <p class="auth-copy">Tài khoản {{ user.email }} cần xác minh email trước khi dùng FTKA. Liên kết xác minh có hiệu lực trong 30 phút.</p>
    {% if message %}<div class="auth-flash success">{{ message }}</div>{% endif %}
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form class="auth-form" method="post" action="{{ url_for('resend_verification_email') }}">
        <button class="dv-cta block" type="submit">Gửi lại email xác minh</button>
    </form>
    <p class="auth-link-row"><a href="{{ url_for('logout') }}">Đăng xuất</a></p>
</section>
{% endblock %}
