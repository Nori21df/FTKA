{% extends "public_base.html" %}

{% block content %}
<section class="auth-panel">
    <h2>Quên mật khẩu</h2>
    <p class="auth-copy">Nhập email tài khoản local để nhận liên kết đặt lại mật khẩu.</p>
    {% if message %}<div class="auth-flash success">{{ message }}</div>{% endif %}
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form class="auth-form" method="post" action="{{ url_for('forgot_password') }}" data-disable-on-submit>
        <label>Email
            <input name="email" type="email" maxlength="255" autocomplete="email" value="{{ email }}" required>
        </label>
        <button class="auth-button" type="submit">Gửi link đặt lại mật khẩu</button>
    </form>
    <p class="auth-link-row"><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p>
</section>

<script>
document.querySelectorAll('[data-disable-on-submit]').forEach((form) => {
    form.addEventListener('submit', () => {
        const button = form.querySelector('button[type="submit"]');
        if (button) {
            button.disabled = true;
            button.textContent = 'Đang gửi...';
        }
    });
});
</script>
{% endblock %}
