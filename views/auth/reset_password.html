{% extends "public_base.html" %}

{% block content %}
<section class="auth-panel">
    <h2>Đặt lại mật khẩu</h2>
    {% if success %}<div class="auth-flash success">{{ success }}</div>{% endif %}
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    {% if token %}
    <form class="auth-form" method="post" action="{{ url_for('reset_password') }}" data-disable-on-submit>
        <input type="hidden" name="token" value="{{ token }}">
        <label>Mật khẩu mới
            <input name="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <label>Xác nhận mật khẩu
            <input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button class="auth-button" type="submit">Cập nhật mật khẩu</button>
    </form>
    {% endif %}
    <p class="auth-link-row"><a href="{{ url_for('forgot_password') }}">Yêu cầu link mới</a></p>
</section>

<script>
document.querySelectorAll('[data-disable-on-submit]').forEach((form) => {
    form.addEventListener('submit', () => {
        const button = form.querySelector('button[type="submit"]');
        if (button) {
            button.disabled = true;
            button.textContent = 'Đang cập nhật...';
        }
    });
});
</script>
{% endblock %}
