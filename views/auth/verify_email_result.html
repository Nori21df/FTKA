{% extends "public_base.html" %}

{% block content %}
<section class="auth-panel">
    <h2>{{ title }}</h2>
    {% if success %}
    <div class="auth-flash success">{{ message }}</div>
    <p class="auth-link-row"><a href="{{ url_for('dashboard') }}">Vào trang chính</a></p>
    {% else %}
    <div class="auth-error">{{ message }}</div>
    <p class="auth-link-row"><a href="{{ url_for('verify_email_required') }}">Gửi lại email xác minh</a></p>
    {% endif %}
</section>
{% endblock %}
