{% extends "admin/base.html" %}
{% block admin_content %}<div class="admin-header"><div><h2>Chỉnh sửa bài nghe</h2><p class="admin-muted">{{ user.username }} · ID {{ lesson.id }}</p></div></div><section class="admin-panel"><form class="admin-detail-form" method="post" action="{{ url_for('admin.user_listening_update', user_id=user.id, id=lesson.id) }}" onsubmit="return confirm('Cập nhật bài nghe này?');"><label>Tiêu đề <input class="admin-input" name="title" value="{{ lesson.title or '' }}"></label><label>Cấp độ <input class="admin-input" name="level" value="{{ lesson.level or '' }}"></label><label>Chủ đề <input class="admin-input" name="topic" value="{{ lesson.topic or '' }}"></label><label>Độ dài <input class="admin-input" name="length" value="{{ lesson.length or '' }}"></label><label>Văn bản KR <textarea class="admin-textarea" name="korean_text">{{ lesson.korean_text or '' }}</textarea></label><label>Dịch VI <textarea class="admin-textarea" name="vietnamese_translation">{{ lesson.vietnamese_translation or '' }}</textarea></label><label>Từ vựng JSON <textarea class="admin-textarea" name="vocabulary">{{ lesson.vocabulary or '' }}</textarea></label><label>Câu hỏi JSON <textarea class="admin-textarea" name="questions">{{ lesson.questions or '' }}</textarea></label><label>Audio path <input class="admin-input" name="audio_path" value="{{ lesson.audio_path or '' }}"></label><label>Audio error <input class="admin-input" name="audio_error" value="{{ lesson.audio_error or '' }}"></label><label>Lý do <input class="admin-input" name="reason"></label><button class="admin-button primary" type="submit">Lưu</button></form></section><section class="admin-panel"><form method="post" action="{{ url_for('admin.user_listening_delete', user_id=user.id, id=lesson.id) }}" onsubmit="return confirm('Xoá bài nghe này? Không thể hoàn tác.');"><button class="admin-button danger" type="submit">Xoá</button></form></section>{% endblock %}
