{% extends "admin/base.html" %}
{% block admin_content %}<div class="admin-header"><div><h2>Chỉnh sửa âm thanh</h2><p class="admin-muted">{{ user.username }} · bài nghe {{ lesson.id }}</p></div></div><section class="admin-panel"><form class="admin-detail-form" method="post" action="{{ url_for('admin.user_audio_update', user_id=user.id, id=lesson.id) }}" onsubmit="return confirm('Cập nhật âm thanh này?');"><label>Audio path <input class="admin-input" name="audio_path" value="{{ lesson.audio_path or '' }}"></label><label>Audio error <input class="admin-input" name="audio_error" value="{{ lesson.audio_error or '' }}"></label><label>Lý do <input class="admin-input" name="reason"></label><button class="admin-button primary" type="submit">Lưu</button></form></section><section class="admin-panel"><form method="post" action="{{ url_for('admin.user_audio_delete', user_id=user.id, id=lesson.id) }}" onsubmit="return confirm('Xoá âm thanh này? DB sẽ xoá tham chiếu trước.');"><button class="admin-button danger" type="submit">Xoá</button></form></section>{% endblock %}
