{% extends "admin/base.html" %}
{% block admin_content %}<div class="admin-header"><div><h2>Chỉnh sửa ngữ pháp</h2><p class="admin-muted">{{ user.username }} · ID {{ item.id }}</p></div></div><section class="admin-panel"><form class="admin-detail-form" method="post" action="{{ url_for('admin.user_grammar_update', user_id=user.id, id=item.id) }}" onsubmit="return confirm('Cập nhật ngữ pháp này?');"><label>Ngữ pháp <input class="admin-input" name="grammar" value="{{ item.grammar or '' }}"></label><label>Nghĩa <input class="admin-input" name="meaning_vi" value="{{ item.meaning_vi or '' }}"></label><label>Giải thích <textarea class="admin-textarea" name="explanation_vi">{{ item.explanation_vi or '' }}</textarea></label><label>Ví dụ KR <textarea class="admin-textarea" name="example_kr">{{ item.example_kr or '' }}</textarea></label><label>Ví dụ VI <textarea class="admin-textarea" name="example_vi">{{ item.example_vi or '' }}</textarea></label><label>Cấp độ <input class="admin-input" name="level" value="{{ item.level or '' }}"></label><label>Ghi chú <textarea class="admin-textarea" name="usage_notes_vi">{{ item.usage_notes_vi or '' }}</textarea></label><label>Lỗi thường gặp <textarea class="admin-textarea" name="common_mistakes_vi">{{ item.common_mistakes_vi or '' }}</textarea></label><label>Nguồn <input class="admin-input" name="source" value="{{ item.source or '' }}"></label><label><input type="checkbox" name="learned" {% if item.learned %}checked{% endif %}> Đã học</label><label>Lý do <input class="admin-input" name="reason"></label><button class="admin-button primary" type="submit">Lưu</button></form></section><section class="admin-panel"><form method="post" action="{{ url_for('admin.user_grammar_delete', user_id=user.id, id=item.id) }}" onsubmit="return confirm('Xoá ngữ pháp này? Không thể hoàn tác.');"><button class="admin-button danger" type="submit">Xoá</button></form></section>{% endblock %}
